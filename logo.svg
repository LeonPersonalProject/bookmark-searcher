<svg width="128" height="128" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- 背景渐变 -->
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#f5f7fa;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="bookmarkGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#818cf8;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#6366f1;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="searchGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#a5b4fc;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#818cf8;stop-opacity:1" />
    </linearGradient>
    <!-- 柔和阴影 -->
    <filter id="softShadow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3"/>
      <feOffset dx="0" dy="2" result="offsetblur"/>
      <feComponentTransfer>
        <feFuncA type="linear" slope="0.2"/>
      </feComponentTransfer>
      <feMerge>
        <feMergeNode/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- 圆角背景 -->
  <rect width="128" height="128" rx="24" fill="url(#bgGradient)"/>

  <!-- 书签形状（主体） - 极简几何 -->
  <g filter="url(#softShadow)">
    <!-- 书签主体 -->
    <path d="M 45 30 L 83 30 C 86 30 88 32 88 35 L 88 90 L 64 75 L 40 90 L 40 35 C 40 32 42 30 45 30 Z"
          fill="url(#bookmarkGradient)"
          opacity="0.9"/>

    <!-- 书签顶部装饰线 -->
    <rect x="48" y="40" width="32" height="3" rx="1.5" fill="white" opacity="0.4"/>
    <rect x="48" y="48" width="24" height="2.5" rx="1.25" fill="white" opacity="0.3"/>
    <rect x="48" y="55" width="28" height="2.5" rx="1.25" fill="white" opacity="0.3"/>
  </g>

  <!-- 搜索放大镜 - 右下角 -->
  <g filter="url(#softShadow)">
    <!-- 放大镜圆圈 -->
    <circle cx="85" cy="85" r="16"
            fill="none"
            stroke="url(#searchGradient)"
            stroke-width="5"
            opacity="0.95"/>
    <!-- 放大镜内部高光 -->
    <circle cx="82" cy="82" r="6"
            fill="white"
            opacity="0.3"/>
    <!-- 放大镜手柄 -->
    <line x1="96" y1="96" x2="106" y2="106"
          stroke="url(#searchGradient)"
          stroke-width="5"
          stroke-linecap="round"
          opacity="0.95"/>
  </g>

  <!-- 装饰性光点 -->
  <circle cx="50" cy="45" r="2" fill="white" opacity="0.6"/>
  <circle cx="70" cy="42" r="1.5" fill="white" opacity="0.5"/>
  <circle cx="95" cy="70" r="1.5" fill="white" opacity="0.4"/>
</svg>
