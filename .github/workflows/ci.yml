name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Run static checks and tests
        run: ./check.sh

      - name: Build and inspect release archive
        shell: bash
        run: |
          set -euo pipefail
          ./build.sh
          version="$(node -p "require('./manifest.json').version")"
          archive="release/bookmark-searcher-v${version}.zip"
          test -f "$archive"
          unzip -Z1 "$archive" | grep -Fx "bookmark-searcher-v${version}/search.js"
          unzip -Z1 "$archive" | grep -Fx "bookmark-searcher-v${version}/keyboard.js"
