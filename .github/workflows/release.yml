name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Validate tag and manifest version
        id: metadata
        shell: bash
        run: |
          set -euo pipefail

          tag_version="${GITHUB_REF_NAME#v}"
          manifest_version="$(node -p "require('./manifest.json').version")"

          if [[ "$tag_version" != "$manifest_version" ]]; then
            echo "Tag version ($tag_version) does not match manifest version ($manifest_version)." >&2
            exit 1
          fi

          echo "version=$manifest_version" >> "$GITHUB_OUTPUT"

      - name: Run static checks and tests
        run: ./check.sh

      - name: Build release package
        run: |
          ./build.sh

      - name: Validate release package contents
        env:
          VERSION: ${{ steps.metadata.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail

          package_path="release/bookmark-searcher-v${VERSION}.zip"
          package_root="bookmark-searcher-v${VERSION}"
          test -f "$package_path"

          unpack_dir="$(mktemp -d)"
          trap 'rm -rf "$unpack_dir"' EXIT
          unzip -q "$package_path" -d "$unpack_dir"

          extracted_dir="$unpack_dir/$package_root"
          test -d "$extracted_dir"

          required_files=(
            manifest.json
            popup.html
            popup.css
            popup.js
            pinyin.js
            search.js
            storage.js
            commands.js
            bookmarks.js
            dialogs.js
            keyboard.js
            README.md
            LICENSE
            PINYIN-DATA.md
            UNICODE-LICENSE.txt
            CHANGELOG.md
            logo.svg
            logo-small.svg
          )
          for file in "${required_files[@]}"; do
            test -f "$extracted_dir/$file"
          done
          test -d "$extracted_dir/icons"

          packaged_version="$(node -e \
            'const fs = require("fs");
             const manifest = JSON.parse(fs.readFileSync(process.argv[1], "utf8"));
             process.stdout.write(manifest.version);' \
            "$extracted_dir/manifest.json")"
          if [[ "$packaged_version" != "$VERSION" ]]; then
            echo "Packaged manifest version ($packaged_version) does not match $VERSION." >&2
            exit 1
          fi

          echo "Validated $package_path ($packaged_version)"

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          files: release/bookmark-searcher-v${{ steps.metadata.outputs.version }}.zip
          body: |
            ## 📦 书签搜索器 v${{ steps.metadata.outputs.version }}

            ### 安装方法
            1. 下载 `bookmark-searcher-v${{ steps.metadata.outputs.version }}.zip`
            2. 解压文件
            3. 打开浏览器扩展管理页面
            4. 开启"开发者模式"
            5. 点击"加载已解压的扩展程序"
            6. 选择解压后的文件夹

            ### 更新日志
            查看 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md) 了解详细更新内容。

        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
