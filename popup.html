<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>书签搜索器</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <!-- 主容器 -->
  <div class="container">
    <!-- 标题区域 -->
    <div class="header">
      <h1>🔖 bookmark-searcher</h1>
    </div>

    <!-- 搜索输入框 -->
    <div class="search-box">
      <input
        type="text"
        id="searchInput"
        placeholder="输入关键词搜索书签..."
        autofocus
      >
      <span class="search-icon">🔍</span>
    </div>

    <!-- 统计信息和导航 -->
    <div class="stats">
      <button id="backButton" class="back-button" style="display: none;">
        <span class="back-icon">←</span>
        <span>返回</span>
      </button>
      <span id="currentPath" class="current-path">所有书签</span>
      <span id="resultCount" class="result-count">加载中...</span>
    </div>

    <!-- 搜索结果列表 -->
    <div class="results" id="results">
      <!-- 结果将通过 JavaScript 动态插入 -->
    </div>

    <!-- 空状态提示 -->
    <div class="empty-state" id="emptyState" style="display: none;">
      <p>😔 没有找到匹配的书签</p>
      <small>尝试使用不同的关键词</small>
    </div>
  </div>

  <!-- 引入 JavaScript 文件 -->
  <script src="popup.js"></script>
</body>
</html>
